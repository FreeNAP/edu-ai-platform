# 生产部署：PostgreSQL + 应用 + Nginx
#   cp deploy/.env.production.example deploy/.env.production   # 修改其中的密码与密钥
#   docker compose up -d --build
#   docker compose exec app python -m app.cli create-admin --username admin --email admin@example.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edu_platform
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: deploy/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://edu:${POSTGRES_PASSWORD}@db:5432/edu_platform
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
